[build]
  publish = "."

# Concept site: keep it out of search results until Nexus signs off
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# TEMPORARY: show the holding page at the root. Delete this block to bring the homepage concept back.
[[redirects]]
  from = "/"
  to = "/placeholder/index.html"
  status = 200
  force = true
