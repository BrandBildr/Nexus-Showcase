[build]
  publish = "."

# Concept site: keep it out of search results until Nexus signs off
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Page templates and the build script aren't part of the public site
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true
