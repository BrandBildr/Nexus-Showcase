<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <base href="/placeholder/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexus Resourcing Group | Connecting talent. Powering projects.</title>
  <meta name="description" content="Nexus Resourcing Group supplies skilled people to commercial, domestic, marine and defence projects in the UK and worldwide. New website coming soon.">
  <meta name="theme-color" content="#0D0907">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="img/hero-ship.webp">
  <style>
    :root { --champagne: #FEE9AE; --brass: #E5BC68; --ink: #0D0907; --bone: #FBFBF9; --bone-70: rgba(251,251,249,.72); --ease: cubic-bezier(.22,.8,.18,1); }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: "Montserrat", system-ui, sans-serif; background: var(--ink); color: var(--bone); -webkit-font-smoothing: antialiased; overflow: hidden; }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .hero { position: relative; height: 100svh; min-height: 520px; display: grid; place-items: center; overflow: hidden; }
    .hero__media { position: absolute; inset: 0; }
    .hero__img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; transform-origin: 50% 40%; }
    .hero__shade { position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 60% 55% at 50% 48%, rgba(13,9,7,.55), transparent 75%),
        linear-gradient(180deg, rgba(13,9,7,.55) 0%, rgba(13,9,7,.25) 35%, rgba(13,9,7,.5) 70%, var(--ink) 100%); }
    .hero__content { position: relative; z-index: 2; text-align: center; padding: 24px 16px; width: 100%; }
    .hero__title { margin: 0; display: flex; flex-direction: column; align-items: center; }
    .hero__icon { position: relative; width: clamp(130px, 17vw, 230px); margin-bottom: clamp(22px, 3.2vw, 40px); filter: drop-shadow(0 10px 40px rgba(0,0,0,.55)); }
    .hero__icon img { width: 100%; height: auto; }
    .hero__shine { position: absolute; inset: 0;
      -webkit-mask: url(img/icon-gold.webp) center / contain no-repeat; mask: url(img/icon-gold.webp) center / contain no-repeat;
      background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.9) 50%, transparent 65%) no-repeat;
      background-size: 250% 100%; background-position: 150% 0; mix-blend-mode: soft-light; }
    .wordmark { display: flex; align-items: flex-end; justify-content: center; gap: clamp(22px, 5vw, 78px); height: clamp(34px, 5.6vw, 76px); }
    .wm { height: 100%; width: auto; filter: drop-shadow(0 4px 20px rgba(0,0,0,.5)); will-change: transform; }
    .hero__group { display: flex; align-items: center; gap: 18px; margin-top: clamp(16px, 2vw, 26px); width: 100%; max-width: min(92vw, 760px); }
    .hero__group .rule { flex: 1; height: 1.5px; background: rgba(251,251,249,.75); }
    .hero__group .rule:first-child { transform-origin: right; }
    .hero__group .rule:last-child { transform-origin: left; }
    .hero__group-text { font-weight: 400; font-size: clamp(.9rem, 2.1vw, 1.75rem); letter-spacing: .42em; text-transform: uppercase; margin-right: -.42em; white-space: nowrap; }
    .hero__tag { margin: clamp(18px, 2.4vw, 28px) 0 0; font-weight: 700; font-size: clamp(.68rem, 1.15vw, .95rem); letter-spacing: .38em; text-transform: uppercase; }
    .hero__soon { margin: clamp(36px, 5vw, 56px) 0 0; display: grid; gap: 10px; justify-items: center; }
    .hero__soon p { margin: 0; font-weight: 600; font-size: .95rem; color: var(--champagne); }
    .hero__soon .contact { font-size: .9rem; font-weight: 400; color: var(--bone-70); }
    .hero__soon a { text-decoration: none; background: linear-gradient(var(--brass), var(--brass)) 0 100% / 0 1.5px no-repeat; transition: background-size .5s var(--ease), color .3s; }
    .hero__soon a:hover { color: var(--bone); background-size: 100% 1.5px; }
    .hero__soon .sep { margin: 0 10px; opacity: .5; }

    /* hidden until the intro plays (only when motion is welcome and GSAP loads) */
    .js-anim .hero__icon, .js-anim .wm, .js-anim .hero__group-text, .js-anim .hero__tag, .js-anim .hero__soon { opacity: 0; }
    .js-anim .hero__group .rule { transform: scaleX(0); }

    @media (max-width: 700px) {
      .hero__tag span { display: block; }
      .hero__tag span + span { margin-top: 6px; }
      .hero__soon .contact span { display: block; }
      .hero__soon .contact .sep { display: none; }
    }
    /* Portrait screens: shorter image band so the whole bow reads, logo sits below it */
    @media (max-aspect-ratio: 4/5) {
      .hero { place-items: end center; }
      .hero__media { inset: 0 0 auto; height: 44svh; }
      .hero__img { object-position: 50% 40%; }
      .hero__shade { background: linear-gradient(180deg, rgba(13,9,7,.35) 0%, rgba(13,9,7,0) 22%, rgba(13,9,7,.7) 36svh, var(--ink) 44svh, var(--ink) 100%); }
      .hero__content { padding: 0 16px 9svh; }
      .hero__icon { width: clamp(110px, 22vw, 180px); margin-bottom: 18px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
  <script>
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('js-anim');
      setTimeout(function () { if (!window.gsap) document.documentElement.classList.remove('js-anim'); }, 4000);
    }
  </script>
</head>
<body>
  <main class="hero">
    <div class="hero__media" aria-hidden="true">
      <img src="img/hero-ship.webp" alt="" class="hero__img">
    </div>
    <div class="hero__shade" aria-hidden="true"></div>

    <div class="hero__content">
      <h1 class="hero__title">
        <span class="sr-only">Nexus Resourcing Group</span>
        <span class="hero__icon" aria-hidden="true">
          <img src="img/icon-gold.webp" alt="" width="900" height="712">
          <span class="hero__shine"></span>
        </span>
        <span class="wordmark" aria-hidden="true">
          <img class="wm" src="img/wm-n-w.png" alt="" height="150">
          <img class="wm" src="img/wm-e-w.png" alt="" height="150">
          <img class="wm wm--x" src="img/wm-x-w.png" alt="" height="150">
          <img class="wm" src="img/wm-u-w.png" alt="" height="150">
          <img class="wm" src="img/wm-s-w.png" alt="" height="150">
        </span>
        <span class="hero__group" aria-hidden="true">
          <span class="rule"></span><span class="hero__group-text">Resourcing Group</span><span class="rule"></span>
        </span>
      </h1>
      <p class="hero__tag"><span>Connecting talent.</span> <span>Powering projects.</span></p>
      <div class="hero__soon">
        <p>New website coming soon</p>
        <div class="contact">
          <span><a href="mailto:nick@nexusrg.co.uk">nick@nexusrg.co.uk</a></span><span class="sep">|</span><span><a href="tel:+447963398473">07963 398473</a></span>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var root = document.documentElement;
      if (!window.gsap || matchMedia('(prefers-reduced-motion: reduce)').matches) { root.classList.remove('js-anim'); return; }
      try {
        var wms = gsap.utils.toArray('.wm');
        var spread = Math.min(window.innerWidth * 0.16, 220);
        var tl = gsap.timeline({ defaults: { ease: 'expo.out' }, delay: 0.15 });
        tl.fromTo('.hero__img', { scale: 1.18 }, { scale: 1.04, duration: 3.2, ease: 'power2.out' }, 0)
          .fromTo(wms,
            { opacity: 0, x: function (i) { return (i - 2) * spread * 2.2; }, filter: 'blur(14px)' },
            { opacity: 1, x: 0, filter: 'blur(0px)', duration: 1.8, stagger: { each: 0.06, from: 'edges' } }, 0.25)
          .fromTo('.wm--x', { rotate: -90, scale: 1.4 }, { rotate: 0, scale: 1, duration: 1.6 }, 0.35)
          .fromTo('.hero__icon', { opacity: 0, scale: 0.55, rotate: -45, y: 20 }, { opacity: 1, scale: 1, rotate: 0, y: 0, duration: 1.6 }, 0.9)
          .fromTo('.hero__shine', { backgroundPosition: '150% 0' }, { backgroundPosition: '-60% 0', duration: 1.6, ease: 'power2.inOut' }, 1.7)
          .to('.hero__group .rule', { scaleX: 1, duration: 1.2 }, 1.3)
          .fromTo('.hero__group-text', { opacity: 0, letterSpacing: '0.9em' }, { opacity: 1, letterSpacing: '0.42em', duration: 1.4 }, 1.3)
          .fromTo('.hero__tag', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 1 }, 1.75)
          .fromTo('.hero__soon', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 1.1 }, 2.05);

        // After the intro: slow ambient drift on the ship, and the gold sheen repeats every few seconds
        gsap.to('.hero__img', { scale: 1.1, xPercent: -1.5, duration: 22, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: 3.4 });
        gsap.fromTo('.hero__shine', { backgroundPosition: '150% 0' }, { backgroundPosition: '-60% 0', duration: 1.8, ease: 'power2.inOut', repeat: -1, repeatDelay: 6, delay: 6 });
      } catch (e) { root.classList.remove('js-anim'); }
    });
  </script>
</body>
</html>
